[package]
name = "brucekit"
version = "0.1.0"
description = "A hotkey-triggered launcher for tiny personal utility tools."
authors = ["bruce"]
edition = "2021"

[lib]
name = "brucekit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
# xpwaste — the "pick an alert sound" file dialog. Playback itself needs no
# audio crate: MCI hands the file to the codecs Windows already ships.
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

image = "0.25"
xcap = "0.0.14"
# pulse module — already in the tree transitively via xcap, so this direct
# dep costs no extra build. Keep the version in step with xcap's.
sysinfo = "0.32"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  # xpwaste — mciSendStringW plays the alert sound through Windows' own codecs.
  "Win32_Media_Multimedia",
  "Storage_Streams",
  "Win32_Foundation",
  # clipstack — reads the "don't record this" clipboard markers password
  # managers set, so secrets never reach the history.
  "Win32_System_DataExchange",
  # xpwaste — MessageBeep, the Windows notification chime, lives here.
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
strip = true

# Dependencies at real optimization even in `tauri dev`: the capture pipeline
# (xcap's DXGI copy, image crops, OCR bitmap shuffling) is unusably slow at
# opt-level 0. Our own crate stays unoptimized for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2
