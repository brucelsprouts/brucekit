[package]
name = "brucekit"
version = "0.1.0"
description = "A hotkey-triggered launcher for tiny personal utility tools."
authors = ["bruce"]
edition = "2021"

[lib]
name = "brucekit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

image = "0.25"
xcap = "0.0.14"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
]

[profile.release]
opt-level = "s"
lto = true
strip = true

# Dependencies at real optimization even in `tauri dev`: the capture pipeline
# (xcap's DXGI copy, image crops, OCR bitmap shuffling) is unusably slow at
# opt-level 0. Our own crate stays unoptimized for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2
