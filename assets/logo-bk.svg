<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- brucekit "bk" monogram — monochrome HUD mark with soft glow -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.02" />
    </pattern>
  </defs>

  <rect width="512" height="512" fill="#0a0b0d" />
  <rect width="512" height="512" fill="url(#scan)" />

  <!-- corner tick brackets -->
  <g stroke="#565d66" stroke-width="4" fill="none">
    <path d="M56 100 V56 h44" />
    <path d="M456 100 V56 h-44" />
    <path d="M56 412 v44 h44" />
    <path d="M456 412 v44 h-44" />
  </g>

  <!-- bk monogram -->
  <g
    stroke="#f4f6f8"
    stroke-width="26"
    stroke-linecap="square"
    fill="none"
    filter="url(#glow)"
  >
    <!-- b -->
    <path d="M152 148 V364" />
    <circle cx="206" cy="308" r="54" />
    <!-- k -->
    <path d="M284 148 V364" />
    <path d="M284 298 L356 226" />
    <path d="M284 298 L360 364" />
  </g>
</svg>
