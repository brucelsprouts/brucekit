<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- "kit knife" — an abstract multi-tool: body outline, one glowing blade open -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#0a0b0d" />

  <g stroke="#565d66" stroke-width="4" fill="none">
    <path d="M56 100 V56 h44" />
    <path d="M456 100 V56 h-44" />
    <path d="M56 412 v44 h44" />
    <path d="M456 412 v44 h-44" />
  </g>

  <g filter="url(#glow)">
    <!-- blade, opened 45° -->
    <path d="M362 312 L468 196 L486 214 L394 330 Z" fill="#f4f6f8" stroke="#f4f6f8" stroke-width="6" stroke-linejoin="round" />
    <!-- body -->
    <rect x="118" y="296" width="260" height="74" rx="16" stroke="#f4f6f8" stroke-width="16" fill="none" />
    <!-- rivets -->
    <circle cx="160" cy="333" r="9" fill="#f4f6f8" />
    <circle cx="336" cy="333" r="9" fill="#f4f6f8" />
  </g>
</svg>
